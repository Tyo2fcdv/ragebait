name: Masscan Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install masscan
        run: |
          sudo apt-get update
          sudo apt-get install -y masscan

      - name: Optimize kernel
        run: |
          sudo sysctl -w net.core.rmem_max=134217728
          sudo sysctl -w net.core.wmem_max=134217728
          sudo sysctl -w net.core.netdev_max_backlog=300000
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 134217728"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 134217728"
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65535"
          sudo sysctl -w net.netfilter.nf_conntrack_max=1048576 2>/dev/null || true

      - name: Run masscan
        run: |
          sudo masscan -iL ip_list.txt \
            -p2087 \
            --rate 100000 \
            --wait 5 \
            --retries 2 \
            --open-only \
            -oL sobig.txt \
            --status 10 \
            --exclude 255.255.255.255 \
            2>&1 | tee output.log

      - name: Fix permission
        if: always()
        run: |
          sudo chown $USER:$USER sobig.txt output.log 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            sobig.txt
            output.log
